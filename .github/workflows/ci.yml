name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Makefile shell
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install
      - name: Provision the research-pipeline test interpreter
        run: uv python install 3.12
      - name: Install
        run: uv sync
      - name: Test
        run: make check

  reports:
    name: Reproducible reports
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Install Makefile shell
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install
      - name: Install
        run: uv sync
      - name: Generate reports
        run: |
          make benchmark
          make eval-hc3
      - name: Validate the nested research pipeline
        run: make -C detection-model-pipeline check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: detector-reports
          path: |
            docs/BENCHMARK.md
            docs/HC3_EVALUATION.md
          retention-days: 14
