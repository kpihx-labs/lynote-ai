name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Install Makefile shell
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --project detection-model-pipeline
      - run: make -C detection-model-pipeline check
