[project]
name = "lynote-detection-model-pipeline"
version = "0.1.0"
description = "Lynote two-level detector research pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
model = [
    "transformers",
    "accelerate",
    "numpy",
    "scikit-learn",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "langdetect",
]
cpu = ["torch"]
xpu = ["torch", "triton-xpu; sys_platform == 'linux'"]
cuda = ["torch"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "xpu" }, { extra = "cuda" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
triton-xpu = [{ index = "pytorch-xpu", extra = "xpu" }]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

# Preserve the upstream namespace layout; stage scripts run from the checkout.
[tool.uv.build-backend]
module-name = "model_entity"
module-root = ""
namespace = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
