[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[project]
name = "lynote-ai"
version = "0.1.1"
description = "Local explainable CLI for AI-generated text risk analysis; adapted from Lynote."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Open Source Contributors" }]
keywords = ["ai-detection", "agent-skill", "claude-code", "codex", "text-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
lynote-ai = "aidetect.cli:main"

[tool.uv.build-backend]
module-name = "aidetect"

[project.urls]
Repository = "https://github.com/kpihx-labs/lynote-ai"
Mirror = "https://gitlab.com/kpihx-labs/ai/llm-detectors/lynote-ai"
Upstream = "https://github.com/lynote-ai/ai-text-detector"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
